name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shipwatch
          POSTGRES_PASSWORD: shipwatch
          POSTGRES_DB: shipwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipwatch -d shipwatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://shipwatch:shipwatch@localhost:5432/shipwatch
      GITHUB_WEBHOOK_SECRET: ci-secret
      SLACK_WEBHOOK_URL: https://hooks.slack.com/services/placeholder
      CRON_SECRET: ci-cron-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
