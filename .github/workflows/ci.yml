name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://shipwatch:shipwatch@localhost:5432/shipwatch
  TEST_DATABASE_URL: postgresql://shipwatch:shipwatch@localhost:5432/shipwatch_test
  GITHUB_WEBHOOK_SECRET: ci-secret
  SLACK_WEBHOOK_URL: https://hooks.slack.com/services/placeholder
  CRON_SECRET: ci-cron-secret
  DASHBOARD_READ_TOKEN: ci-dashboard-token
  FRONTEND_ORIGIN: http://localhost:5173
  NODE_ENV: test

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm exec --workspace backend -- tsx ../scripts/check-vercel-crons.ts
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:unit --workspace backend -- --reporter=json --outputFile=backend-unit-results.json
      - run: node backend/scripts/assert-no-skips.mjs backend-unit-results.json
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-unit-results
          path: backend-unit-results.json
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shipwatch
          POSTGRES_PASSWORD: shipwatch
          POSTGRES_DB: shipwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipwatch -d shipwatch_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:integration --workspace backend -- --reporter=json --outputFile=backend-integration-results.json
      - run: node backend/scripts/assert-no-skips.mjs backend-integration-results.json
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-integration-results
          path: backend-integration-results.json
          if-no-files-found: ignore

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test --workspace frontend -- --reporter=json --outputFile=frontend-results.json
      - run: node backend/scripts/assert-no-skips.mjs frontend-results.json
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-results
          path: frontend-results.json
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit, integration, frontend-tests]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run build --workspace backend
      - run: npm run build --workspace frontend
      - run: npm audit --omit=dev --audit-level=high
