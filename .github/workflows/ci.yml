name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shipwatch
          POSTGRES_PASSWORD: shipwatch
          POSTGRES_DB: shipwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipwatch -d shipwatch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://shipwatch:shipwatch@localhost:5432/shipwatch
      TEST_DATABASE_URL: postgresql://shipwatch:shipwatch@localhost:5432/shipwatch_test
      GITHUB_WEBHOOK_SECRET: ci-secret
      SLACK_WEBHOOK_URL: https://hooks.slack.com/services/placeholder
      CRON_SECRET: ci-cron-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Run backend unit tests
        run: npm run test:unit --workspace backend -- --reporter=json --outputFile=../backend-unit-results.json
      - name: Run backend integration tests
        run: npm run test:integration --workspace backend -- --reporter=json --outputFile=../backend-integration-results.json
      - name: Reject skipped tests
        run: node backend/scripts/assert-no-skips.mjs backend-unit-results.json backend-integration-results.json
      - name: Run frontend tests
        run: npm run test --workspace frontend
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: |
            backend-*-results.json
            backend/test-results
          if-no-files-found: ignore
